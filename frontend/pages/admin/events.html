<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Events - UIU Alumni Portal</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding-top: calc(var(--header-height) + var(--space-8)); padding-bottom: var(--space-12);">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-4); margin-bottom: var(--space-8);">
      <div>
        <h1 class="section-title" style="font-size: var(--font-size-3xl);">Upcoming <span class="highlight-underline">Events</span></h1>
        <p class="section-subtitle">Stay connected through official UIU alumni galas, career webinars, and batch reunions.</p>
      </div>
      <div id="admin-create-event-wrapper" style="display: none;">
        <a href="admin/event-form.html" class="btn btn-primary btn-lg" style="border-radius: var(--radius-full);">+ Create Event</a>
      </div>
    </div>

    <!-- Featured Event Banner -->
    <div id="featured-event-container"></div>

    <!-- Search & Filter Card -->
    <div class="card" style="padding: var(--space-6); background: #FFFFFF; border-radius: var(--radius-xl); margin-bottom: var(--space-8);">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: var(--space-4); align-items: center;">
        <div style="position: relative;">
          <input type="text" id="events-search-input" class="form-control" placeholder="Search events by title, type, or keyword..." style="padding-left: 38px;">
          <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-light); pointer-events: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line></svg>
          </span>
        </div>

        <div>
          <select id="events-type-filter" class="form-control">
            <option value="">All Event Types</option>
            <option value="Reunion">Reunion</option>
            <option value="Webinar">Webinar</option>
            <option value="Workshop">Workshop</option>
            <option value="Networking">Networking</option>
            <option value="Conference">Conference</option>
            <option value="Seminar">Seminar</option>
          </select>
        </div>

        <div>
          <select id="events-date-filter" class="form-control">
            <option value="">All Dates</option>
            <option value="this-month">This Month</option>
            <option value="upcoming">Upcoming</option>
          </select>
        </div>

        <div>
          <button id="events-clear-all" class="btn btn-ghost" style="color: var(--color-primary);">Clear all</button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-6); border-top: 1px solid var(--color-border-light); padding-top: var(--space-4);">
        <div style="font-size: var(--font-size-sm); color: var(--color-text-muted);">
          Showing <strong id="events-count-num" style="color: var(--color-primary);">0</strong> Events
        </div>
        <div style="display: flex; align-items: center; gap: var(--space-2);">
          <label for="events-sort-select" style="font-size: var(--font-size-xs); color: var(--color-text-muted); font-weight: 600;">Sort by:</label>
          <select id="events-sort-select" class="form-control" style="width: auto; padding: 4px 8px; font-size: var(--font-size-xs);">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3-Column Events Grid -->
    <div id="events-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-6);">
      <div class="loading-spinner"></div>
    </div>

    <!-- Pagination -->
    <div id="events-pagination" class="pagination" style="display: none; margin-top: var(--space-8);"></div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="../js/pages/events.js"></script>
</body>
</html>
